# A *sandboxed* Python entry point for 'environment' runs
# (i.e., ``flask db migrate`` / ``flask db upgrade``).
#
# For more information on configuring Alembic, see:
# https://alembic.sqlalchemy.org/en/latest/config.html

[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///data.db
# Set to 'true' to use the Alembic environment.py file for migrations.
# The Flask-Migrate extension handles this automatically.
prepend_sys_path = .
output_encoding = utf-8
version_path_separator = os  # Use os.pathsep

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
