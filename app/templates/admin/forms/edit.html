<style>
.split-editor { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1rem; }
.split-pane { border:1px solid #ddd; border-radius:6px; overflow:hidden; }
.split-pane-header { background:#f8f9fa; padding:8px 12px; border-bottom:1px solid #ddd; font-weight:600; font-size:0.9em; }
.split-pane-content { padding:12px; height:400px; overflow-y:auto; }
.editor-textarea { width:100%; height:100%; border:none; resize:none; font-family:monospace; font-size:13px; line-height:1.5; outline:none; }
.preview-form { max-width:100%; }
.preview-error { color:#c00; padding:1rem; background:#fff5f5; border-radius:4px; }
@media (max-width: 768px) { .split-editor { grid-template-columns:1fr; } }
</style>
<form method="POST" id="formEditor">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Name <input name="name" value="{{ f.name }}" required></label>
<label>Module <select name="module_id">{% for m in modules %}<option value="{{ m.id }}" {% if m.id == f.module_id %}selected{% endif %}>{{ m.name }}</option>{% endfor %}</select></label>
<div class="split-editor">
  <div class="split-pane">
    <div class="split-pane-header">Schema JSON</div>
    <div class="split-pane-content">
      <textarea name="schema_json" id="schemaEditor" class="editor-textarea" style="font-family:monospace;">{{ f.schema_json|safe }}</textarea>
    </div>
  </div>
  <div class="split-pane">
    <div class="split-pane-header">Live Preview</div>
    <div class="split-pane-content" id="previewPane">
      <div id="previewContent" class="preview-form"></div>
    </div>
  </div>
</div>
<div style="margin-top:1rem;">
<button>Save</button>
<button type="button" onclick="openFormAI()" style="margin-left:0.5rem;padding:6px 16px;background:#6366f1;color:#fff;border:none;border-radius:4px;cursor:pointer;">AI Design Form</button>
</div>
</form>
<script>
(function() {
  var editor = document.getElementById('schemaEditor');
  var preview = document.getElementById('previewContent');
  var debounceTimer;
  
  console.log('Form editor init - editor:', !!editor, 'preview:', !!preview);
  if (!editor || !preview) {
    console.error('Form editor elements not found');
    return;
  }
  
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }
  function renderPreview() {
    var json = editor.value.trim();
    console.log('Render preview - json length:', json.length, 'first 100:', json.substring(0, 100));
    
    if (!json || json === '[]') {
      preview.innerHTML = '<p style="color:#888;">No fields defined</p>';
      return;
    }
    
    try {
      var fields = JSON.parse(json);
      console.log('Parsed', fields.length, 'fields');
      if (!Array.isArray(fields)) throw new Error('Expected array');
      
      var html = '<form onsubmit="event.preventDefault(); alert(' + JSON.stringify('Form submitted (preview only)') + ');">';
      for (var i = 0; i < fields.length; i++) {
        var field = fields[i];
        var name = escapeHtml(field.name || '');
        var label = escapeHtml(field.label || name);
        var type = escapeHtml(field.type || 'text');
        var required = field.required ? 'required' : '';
        var placeholder = escapeHtml(field.placeholder || '');
        
        html += '<div style="margin-bottom:12px;">';
        html += '<label for="' + name + '" style="display:block;font-weight:600;margin-bottom:4px;">' + label + '</label>';
        
        if (type === 'textarea') {
          html += '<textarea id="' + name + '" name="' + name + '" ' + required + ' placeholder="' + placeholder + '" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;min-height:80px;"></textarea>';
        } else if (type === 'select') {
          var opts = (field.options || '').split(',').map(function(o) { return escapeHtml(o.trim()); }).filter(Boolean);
          html += '<select id="' + name + '" name="' + name + '" ' + required + ' style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;">';
          for (var j = 0; j < opts.length; j++) {
            html += '<option value="' + opts[j] + '">' + opts[j] + '</option>';
          }
          html += '</select>';
        } else if (type === 'checkbox') {
          html += '<div style="margin-top:4px;"><input type="checkbox" id="' + name + '" name="' + name + '" ' + required + '> <span style="font-weight:normal;">' + label + '</span></div>';
        } else if (type === 'file') {
          html += '<input type="file" id="' + name + '" name="' + name + '" ' + required + ' style="width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;">';
        } else {
          html += '<input type="' + type + '" id="' + name + '" name="' + name + '" ' + required + ' placeholder="' + placeholder + '" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;">';
        }
        html += '</div>';
      }
      html += '<button type="submit" style="padding:8px 16px;background:#080;color:#fff;border:none;border-radius:4px;cursor:pointer;">Submit</button>';
      html += '</form>';
      preview.innerHTML = html;
      console.log('Rendered preview with', fields.length, 'fields');
    } catch (e) {
      console.error('JSON parse error:', e);
      preview.innerHTML = '<div class="preview-error">Invalid JSON: ' + escapeHtml(e.message) + '</div>';
    }
  }
  
  editor.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderPreview, 300);
  });
  
  renderPreview();
})();
</script>

<div id="formAIModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10003;">
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:8px;padding:1.5rem;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h3 style="margin:0;">AI Form Designer</h3>
      <button onclick="document.getElementById('formAIModal').style.display='none'" style="background:none;border:none;font-size:1.5rem;cursor:pointer;">&times;</button>
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:0.5rem;font-weight:600;">Describe the form you want to create:</label>
      <textarea id="formAIDescription" rows="4" style="width:100%;font-family:monospace;padding:8px;border:1px solid #ccc;border-radius:4px;" placeholder="e.g., Contact form with name, email, phone number, and message fields..."></textarea>
      <button onclick="generateFormSchema()" style="margin-top:0.5rem;padding:6px 16px;background:#6366f1;color:#fff;border:none;border-radius:4px;cursor:pointer;">Generate Schema</button>
    </div>
    <div id="formAIResult"></div>
  </div>
</div>

<script>
function openFormAI() {
  document.getElementById('formAIDescription').value = '';
  document.getElementById('formAIResult').innerHTML = '';
  document.getElementById('formAIModal').style.display = 'block';
}

function generateFormSchema() {
  var description = document.getElementById('formAIDescription').value.trim();
  var resultDiv = document.getElementById('formAIResult');
  
  if (!description) {
    resultDiv.innerHTML = '<div style="background:#fee;border:1px solid #fcc;padding:1rem;border-radius:4px;"><strong style="color:#c00;">Error:</strong> Please describe the form you want</div>';
    return;
  }
  
  resultDiv.innerHTML = '<p style="color:#888;">Generating form schema...</p>';
  
  var csrfToken = document.querySelector('[name=csrf_token]').value;
  var existingSchema = document.getElementById('schemaEditor').value;
  
  fetch('/__admin/forms/ask-ai', {
    method: 'POST',
    headers: { 
      'Content-Type': 'application/json', 
      'X-CSRFToken': csrfToken 
    },
    body: JSON.stringify({ 
      description: description,
      existing_schema: existingSchema
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.success) {
      resultDiv.innerHTML = '<div style="background:#fee;border:1px solid #fcc;padding:1rem;border-radius:4px;"><strong style="color:#c00;">Error:</strong> ' + escapeHtml(data.error) + '</div>';
      return;
    }
    
    var html = '<div style="line-height:1.6;margin-bottom:1rem;">' + escapeHtml(data.reply) + '</div>';
    
    if (data.schema_json) {
      html += '<div style="margin-top:1rem;display:flex;gap:8px;flex-wrap:wrap;">';
      html += '<button onclick="applySchema(\'' + btoa(unescape(encodeURIComponent(data.schema_json))) + '\')" style="padding:6px 14px;background:#28a745;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.85em;">Apply Schema</button>';
      html += '<button onclick="copySchema(\'' + btoa(unescape(encodeURIComponent(data.schema_json))) + '\')" style="padding:6px 14px;background:#f0f0f0;color:#333;border:1px solid #ccc;border-radius:4px;cursor:pointer;font-size:0.85em;">Copy to Clipboard</button>';
      html += '</div>';
    }
    
    if (data.diff && data.diff.length > 0) {
      html += renderDiff(data.diff, 'form');
    }
    
    resultDiv.innerHTML = html;
  })
  .catch(function(err) {
    resultDiv.innerHTML = '<div style="background:#fee;border:1px solid #fcc;padding:1rem;border-radius:4px;"><strong style="color:#c00;">Request failed:</strong> ' + err.message + '</div>';
  });
}

function applySchema(encodedSchema) {
  var schema = decodeURIComponent(escape(atob(encodedSchema)));
  document.getElementById('schemaEditor').value = schema;
  document.getElementById('formAIModal').style.display = 'none';
  renderPreview();
}

function copySchema(encodedSchema) {
  var schema = decodeURIComponent(escape(atob(encodedSchema)));
  navigator.clipboard.writeText(schema).then(function() {
    var btn = event.target;
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.textContent = 'Copy to Clipboard'; }, 2000);
  });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function renderDiff(diffLines, type) {
  var html = '<div style="margin-top:1rem;">';
  html += '<div style="background:#f8f9fa;padding:8px 12px;border-bottom:1px solid #ddd;font-weight:600;font-size:0.9em;">Schema Diff</div>';
  html += '<pre style="background:#f4f4f4;padding:1rem;border-radius:4px;overflow-x:auto;font-size:0.8em;line-height:1.4;max-height:300px;overflow-y:auto;border:1px solid #ddd;margin:0;">';
  
  for (var i = 0; i < diffLines.length; i++) {
    var line = diffLines[i];
    var cssStyle = '';
    if (line.type === 'added') {
      cssStyle = 'style="background:#d4edda;color:#155724;"';
    } else if (line.type === 'removed') {
      cssStyle = 'style="background:#f8d7da;color:#721c24;"';
    } else {
      cssStyle = 'style="color:#666;"';
    }
    
    var prefix = '';
    if (line.type === 'added') prefix = '+ ';
    else if (line.type === 'removed') prefix = '- ';
    else prefix = '  ';
    
    html += '<div ' + cssStyle + '>' + prefix + escapeHtml(line.value) + '</div>';
  }
  
  html += '</pre></div>';
  return html;
}
</script>
