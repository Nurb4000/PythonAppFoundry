<style>
.graph-controls {
  display: flex;
  gap: 1rem;
  align-items: center;
  margin: 1rem 0;
  padding: 1rem;
  background: #f8f9fa;
  border-radius: 6px;
  border: 1px solid #e0e0e0;
}
.graph-controls select, .graph-controls button {
  padding: 6px 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 0.9em;
}
.graph-controls button {
  background: #06c;
  color: white;
  cursor: pointer;
  border: none;
}
.graph-controls button:hover {
  background: #05a;
}
.graph-controls button.rescan-btn {
  background: #28a745;
}
.graph-controls button.rescan-btn:hover {
  background: #218838;
}
#graph-container {
  background: white;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  padding: 2rem;
  min-height: 400px;
  overflow: auto;
}
#graph-container .mermaid {
  display: flex;
  justify-content: center;
}
.cycle-alert {
  background: #f8d7da;
  border: 1px solid #f5c2c7;
  color: #721c24;
  padding: 1rem;
  border-radius: 6px;
  margin: 1rem 0;
}
.cycle-alert h3 {
  margin-top: 0;
  color: #721c24;
}
.cycle-alert ul {
  margin: 0.5rem 0;
  padding-left: 1.5rem;
}
.cycle-alert li {
  margin: 0.25rem 0;
}
.legend {
  display: flex;
  gap: 1.5rem;
  margin: 1rem 0;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9em;
}
.legend-color {
  width: 20px;
  height: 4px;
  border-radius: 2px;
}
.legend-color.route { background: #06c; }
.legend-color.script { background: #28a745; }
.legend-color.cycle { background: #dc3545; height: 6px; }
.info-box {
  background: #e7f3ff;
  border: 1px solid #b3d9ff;
  color: #004085;
  padding: 1rem;
  border-radius: 6px;
  margin: 1rem 0;
}
</style>

<div class="graph-controls">
  <label>Filter by module:
    <select id="module-filter" onchange="filterGraph()">
      <option value="">All modules</option>
    </select>
  </label>
  <button onclick="resetFilter()">Show All</button>
  <button class="rescan-btn" onclick="rescanAll()">Scan All for Dependencies</button>
  <span id="graph-status" style="margin-left:auto;color:#666;font-size:0.9em;"></span>
</div>

<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div id="legend" class="legend">
  <div class="legend-item"><div class="legend-color route"></div> Route reference</div>
  <div class="legend-item"><div class="legend-color script"></div> Script reference</div>
  <div class="legend-item"><div class="legend-color cycle"></div> Cycle detected</div>
</div>

<div id="cycle-alerts"></div>

<div id="graph-container">
  <div class="mermaid" id="mermaid-graph">Loading dependency graph...</div>
</div>

<p style="margin-top:1rem;"><a href="{{ url_for('admin.modules.list_modules') }}">&larr; Back to modules</a></p>

<script src="/static/mermaid.min.js"></script>
<script>
let graphData = {{ graph_data | tojson }};
let currentFilter = '';

mermaid.initialize({
  startOnLoad: false,
  theme: 'default',
  flowchart: {
    useMaxWidth: true,
    htmlLabels: true,
    curve: 'basis'
  }
});

function escapeId(slug) {
  return slug.replace(/[^a-zA-Z0-9_-]/g, '_');
}

function buildDiagram(data, filterSlug) {
  if (!data || !data.nodes || data.nodes.length === 0) {
    return 'graph LR\n  classDef cycleNode fill:#f8d7da,stroke:#f5c2c7,color:#721c24;\n';
  }

  let definition = 'graph LR\n';

  const cycleSlugs = new Set();
  for (const cycle of data.cycles) {
    for (const slug of cycle) {
      cycleSlugs.add(slug);
    }
  }

  const filteredNodes = filterSlug ? data.nodes.filter(n => n.slug === filterSlug || 
    data.edges.some(e => (e.source === filterSlug && e.target === n.slug) || 
                         (e.target === filterSlug && e.source === n.slug))) : data.nodes;

  const filteredEdges = filterSlug ? data.edges.filter(e => 
    e.source === filterSlug || e.target === filterSlug) : data.edges;

  definition += '  classDef cycleNode fill:#f8d7da,stroke:#f5c2c7,color:#721c24;\n';

  for (const node of filteredNodes) {
    const safeId = escapeId(node.slug);
    definition += '  ' + safeId + '["' + node.name + '"]\n';
  }

  const cycleNodeIds = [];
  for (const node of filteredNodes) {
    if (cycleSlugs.has(node.slug)) {
      cycleNodeIds.push(escapeId(node.slug));
    }
  }
  if (cycleNodeIds.length > 0) {
    definition += '  class ' + cycleNodeIds.join(',') + ' cycleNode;\n';
  }

  for (const edge of filteredEdges) {
    const srcSafe = escapeId(edge.source);
    const tgtSafe = escapeId(edge.target);
    let line;
    if (edge.type === 'script_reference') {
      line = srcSafe + ' -. ' + edge.type + ' .-> ' + tgtSafe;
    } else {
      line = srcSafe + ' -- ' + edge.type + ' --> ' + tgtSafe;
    }
    definition += '  ' + line + '\n';
  }

  return definition;
}

async function renderGraph() {
  const statusEl = document.getElementById('graph-status');
  statusEl.textContent = 'Rendering...';

  const definition = buildDiagram(graphData, currentFilter);
  const container = document.getElementById('mermaid-graph');
  
  console.log('Mermaid definition:', definition);
  console.log('Mermaid object:', typeof mermaid, Object.keys(mermaid).slice(0, 10));

  try {
    if (typeof mermaid.render !== 'function') {
      throw new Error('mermaid.render is not a function');
    }
    const result = await mermaid.render('mermaid-graph', definition);
    console.log('Render result:', result);
    if (result && result.svg) {
      container.innerHTML = result.svg;
      statusEl.textContent = graphData.nodes.length + ' modules, ' + graphData.edges.length + ' dependencies';
    } else {
      container.innerHTML = '<div style="color:#dc3545;padding:1rem;">Render returned no SVG</div>';
    }
  } catch (e) {
    container.innerHTML = '<div style="color:#dc3545;padding:1rem;">Error rendering graph.<br><details open><summary>Show definition</summary><pre style="white-space:pre-wrap;font-size:0.8em;background:#f5f5f5;padding:1rem;border:1px solid #ddd;">' + definition.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre></details><br>Details: ' + e.message + '</div>';
    statusEl.textContent = 'Render error';
    console.error('Mermaid render error:', e);
  }
}

function showCycleAlerts() {
  const container = document.getElementById('cycle-alerts');
  if (!graphData.cycles || graphData.cycles.length === 0) {
    container.innerHTML = '';
    return;
  }

  let html = '<div class="cycle-alert">';
  html += '<h3>' + graphData.cycles.length + ' cycle' + (graphData.cycles.length > 1 ? 's' : '') + ' detected</h3>';
  html += '<p>Circular dependencies can cause issues during module deletion or refactoring:</p>';
  html += '<ul>';
  for (const cycle of graphData.cycles) {
    html += '<li><strong>' + cycle.join(' → ') + ' → ' + cycle[0] + '</strong></li>';
  }
  html += '</ul>';
  html += '<p style="margin-top:0.5rem;color:#666;">Consider refactoring to break these cycles by extracting shared logic into a separate module.</p>';
  html += '</div>';
  container.innerHTML = html;
}

function populateFilter() {
  const select = document.getElementById('module-filter');
  for (const node of graphData.nodes) {
    const opt = document.createElement('option');
    opt.value = node.slug;
    opt.textContent = node.name + ' (' + node.slug + ')';
    select.appendChild(opt);
  }
}

window.filterGraph = function() {
  const select = document.getElementById('module-filter');
  currentFilter = select.value;
  renderGraph();
};

window.resetFilter = function() {
  currentFilter = '';
  document.getElementById('module-filter').value = '';
  renderGraph();
};

window.rescanAll = async function() {
  if (!confirm('Scan all modules for dependencies? This may take a moment.')) return;
  const statusEl = document.getElementById('graph-status');
  statusEl.textContent = 'Scanning all modules...';
  
  try {
    const csrfInput = document.querySelector('input[name="csrf_token"]');
    const csrfToken = csrfInput ? csrfInput.value : '';
    const response = await fetch('{{ url_for("admin.modules.scan_all_dependencies") }}', {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'X-CSRF-Token': csrfToken
      }
    });
    if (response.ok) {
      const result = await response.json();
      if (result.errors && result.errors.length > 0) {
        statusEl.textContent = 'Scan complete with errors: ' + result.errors.join(', ');
      } else {
        statusEl.textContent = 'Scan complete. Refreshing graph...';
        location.reload();
      }
    } else {
      statusEl.textContent = 'Scan failed. Status: ' + response.status;
    }
  } catch (e) {
    statusEl.textContent = 'Scan error: ' + e.message;
  }
};

populateFilter();
showCycleAlerts();
renderGraph().catch(e => console.error('Initial render failed:', e));
</script>
