<form id="importForm" method="POST" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="update_existing" id="updateExisting" value="false">
  <input type="hidden" name="version_comment" id="versionCommentHidden" value="">
  <label style="display:block;margin-bottom:0.5rem;">XML file <input name="file" type="file" accept=".xml" id="xmlFileInput" required onchange="if(this.files[0]) previewImport()"></label>
</form>

<div id="importPreview" style="margin-top:1rem;display:none;">
  <div style="background:#f4f4f4;border:1px solid #ddd;padding:1rem;border-radius:4px;">
    <h4 style="margin-top:0;">Import Preview</h4>
    <div id="previewContent"></div>

    <div id="updateSection" style="display:none;margin-top:1rem;padding:1rem;background:#fff3cd;border:1px solid #ffc107;border-radius:4px;">
      <label style="display:block;font-weight:bold;margin-bottom:0.5rem;">Version comment for update:</label>
      <input type="text" id="versionComment" placeholder="e.g. Added new field, fixed bug in X" style="width:100%;margin-bottom:0.5rem;">
      <p style="font-size:0.85em;color:#666;margin:0;">This will update the existing module and create an automatic version snapshot.</p>
    </div>

    <div style="margin-top:1rem;display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" id="btnUpdate" onclick="submitImport(true)" style="display:none;padding:6px 16px;background:#0d6efd;color:#fff;border:none;border-radius:4px;cursor:pointer;">Update Existing Module</button>
      <button type="button" id="btnNew" onclick="submitImport(false)" style="padding:6px 16px;">Import as New</button>
      <button type="button" onclick="document.getElementById('importPreview').style.display='none'" style="padding:6px 16px;background:#6c757d;color:#fff;border:none;border-radius:4px;cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<script>
function previewImport() {
  var fileInput = document.getElementById('xmlFileInput');
  if (!fileInput.files[0]) { alert('Please select a file first'); return; }
  var formData = new FormData();
  formData.append('import_xml', fileInput.files[0]);
  formData.append('csrf_token', document.querySelector('[name=csrf_token]').value);
  fetch('/__admin/import-preview', { method: 'POST', body: formData })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) { alert('Preview failed: ' + data.error); return; }
      var p = data.preview;
      var html = '<p><strong>' + p.name + '</strong> (slug: <code>' + p.slug + '</code>)</p>';
      html += '<ul><li>Scripts: ' + p.counts.scripts + '</li><li>Routes: ' + p.counts.routes + '</li><li>Forms: ' + p.counts.forms + '</li><li>Tasks: ' + p.counts.tasks + '</li><li>Triggers: ' + p.counts.triggers + '</li>';
      if (p.counts.credentials > 0) html += '<li>Credentials: ' + p.counts.credentials + ' <span style="color:#856404;">(values needed)</span></li>';
      if (p.counts.has_requirements) html += '<li>Requirements: <span style="color:#0d6efd;">will install via pip</span></li>';
      html += '</ul>';
      document.getElementById('previewContent').innerHTML = html;

      if (p.existing) {
        document.getElementById('updateSection').style.display = 'block';
        document.getElementById('btnUpdate').style.display = 'inline-block';
        document.getElementById('btnNew').style.display = 'none';
        document.getElementById('versionComment').focus();
      } else {
        document.getElementById('updateSection').style.display = 'none';
        document.getElementById('btnUpdate').style.display = 'none';
        document.getElementById('btnNew').style.display = 'inline-block';
      }
      document.getElementById('importPreview').style.display = 'block';
    })
    .catch(function(err) { alert('Request failed: ' + err.message); });
}

function submitImport(updateExisting) {
  var fileInput = document.getElementById('xmlFileInput');
  if (!fileInput.files[0]) { alert('Please select a file first'); return; }
  document.getElementById('updateExisting').value = updateExisting ? 'true' : 'false';
  document.getElementById('versionCommentHidden').value = document.getElementById('versionComment').value;
  document.getElementById('importForm').submit();
}
</script>
