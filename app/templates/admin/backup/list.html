<div style="display:flex;gap:0.75rem;align-items:center;margin-bottom:1rem;">
  <a href="{{ url_for('admin.backup.backup_database') }}">Create New Backup</a>
</div>
{% if backups %}
<div class="table-wrap">
<table>
<thead><tr>
  <th>Filename</th>
  <th>Size</th>
  <th>Created</th>
  <th>Actions</th>
</tr></thead>
<tbody>
{% for b in backups %}
<tr>
  <td><code>{{ b.filename }}</code></td>
  <td>{{ '%0.1f MB'|format(b.size / 1048576) }}</td>
  <td>{{ b.created_at.strftime('%Y-%m-%d %H:%M UTC') }}</td>
  <td>
    <a href="{{ url_for('admin.backup.download_backup', path=b.filename) }}">Download</a>
    <form method="POST" action="{{ url_for('admin.backup.delete_backup', path=b.filename) }}" style="display:inline" onsubmit="return confirm('Delete backup {{ b.filename }}?')">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" style="background:none;border:none;color:#c00;cursor:pointer;text-decoration:underline;padding:0;font:inherit">Delete</button>
    </form>
  </td>
</tr>
{% endfor %}
</tbody></table>
</div>
{% else %}
<p style="color:#888;">No backups found. Create one to get started.</p>
{% endif %}
