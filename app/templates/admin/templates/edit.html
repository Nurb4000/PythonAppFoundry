<style>
.template-editor { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1rem; }
.template-pane { border:1px solid #ddd; border-radius:6px; overflow:hidden; }
.template-pane-header { background:#f8f9fa; padding:8px 12px; border-bottom:1px solid #ddd; font-weight:600; font-size:0.9em; display:flex; justify-content:space-between; align-items:center; }
.template-pane-content { padding:0; height:450px; overflow-y:auto; }
.editor-textarea { width:100%; height:100%; border:none; resize:none; font-family:monospace; font-size:13px; line-height:1.5; outline:none; padding:12px; box-sizing:border-box; }
.preview-frame { padding:12px; }
.preview-error { color:#c00; padding:1rem; background:#fff5f5; border-radius:4px; margin:12px; }
.context-input { width:100%; border:1px solid #ddd; border-radius:4px; padding:6px 8px; font-size:12px; font-family:monospace; }
.btn-preview { padding:4px 12px; background:#080; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:12px; }
.btn-preview:hover { background:#060; }
@media (max-width: 768px) { .template-editor { grid-template-columns:1fr; } }
</style>
<form method="POST" id="templateForm">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Name <input name="name" value="{{ t.name }}" required></label>
<label>Module <select name="module_id">{% for m in modules %}<option value="{{ m.id }}" {% if m.id == t.module_id %}selected{% endif %}>{{ m.name }}</option>{% endfor %}</select></label>
<label>Content Type <select name="content_type">
  <option value="html" {% if t.content_type == 'html' %}selected{% endif %}>HTML</option>
  <option value="text" {% if t.content_type == 'text' %}selected{% endif %}>Plain Text</option>
  <option value="json" {% if t.content_type == 'json' %}selected{% endif %}>JSON</option>
</select></label>
<label>Description <input name="description" value="{{ t.description or '' }}" placeholder="Brief description of this template"></label>
<div class="template-editor">
  <div class="template-pane">
    <div class="template-pane-header">Template Body (Jinja2)</div>
    <div class="template-pane-content">
      <textarea name="body" id="templateEditor" class="editor-textarea">{{ t.body }}</textarea>
    </div>
  </div>
  <div class="template-pane">
    <div class="template-pane-header">
      <span>Preview</span>
      <span>
        <input type="text" id="contextInput" class="context-input" placeholder='{"name":"World","items":["a","b"]}' style="width:300px;display:inline-block;margin-right:8px;">
        <button type="button" class="btn-preview" id="previewBtn">Render</button>
      </span>
    </div>
    <div class="template-pane-content">
      <div id="previewContent" class="preview-frame">
        <p style="color:#888;padding:12px;">Click "Render" to preview with sample context</p>
      </div>
    </div>
  </div>
</div>
<div style="margin-top:1rem;">
<button>Save</button>
</div>
</form>
<script>
(function() {
  var editor = document.getElementById('templateEditor');
  var preview = document.getElementById('previewContent');
  var btn = document.getElementById('previewBtn');
  var ctxInput = document.getElementById('contextInput');

  if (!editor || !btn) return;

  btn.addEventListener('click', function() {
    var body = editor.value;
    var context = {};
    try {
      var raw = ctxInput.value.trim();
      if (raw) context = JSON.parse(raw);
    } catch(e) {
      preview.innerHTML = '<div class="preview-error">Invalid JSON context: ' + e.message + '</div>';
      return;
    }

    btn.textContent = 'Rendering...';
    btn.disabled = true;

    fetch('/__admin/templates/preview', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': document.querySelector('input[name="csrf_token"]').value
      },
      body: JSON.stringify({ body: body, context: context })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      btn.textContent = 'Render';
      btn.disabled = false;
      if (data.success) {
        preview.innerHTML = data.rendered;
      } else {
        preview.innerHTML = '<div class="preview-error">' + (data.error || 'Render failed') + '</div>';
      }
    })
    .catch(function(err) {
      btn.textContent = 'Render';
      btn.disabled = false;
      preview.innerHTML = '<div class="preview-error">Request failed: ' + err.message + '</div>';
    });
  });
})();
</script>
