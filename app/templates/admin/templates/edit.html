<style>
.template-editor { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1rem; }
.template-pane { border:1px solid #ddd; border-radius:6px; overflow:hidden; }
.template-pane-header { background:#f8f9fa; padding:8px 12px; border-bottom:1px solid #ddd; font-weight:600; font-size:0.9em; display:flex; justify-content:space-between; align-items:center; }
.template-pane-content { padding:0; height:450px; overflow-y:auto; }
.editor-textarea { width:100%; height:100%; border:none; resize:none; font-family:monospace; font-size:13px; line-height:1.5; outline:none; padding:12px; box-sizing:border-box; }
.preview-frame { padding:12px; }
.preview-error { color:#c00; padding:1rem; background:#fff5f5; border-radius:4px; margin:12px; }
.context-input { width:100%; border:1px solid #ddd; border-radius:4px; padding:6px 8px; font-size:12px; font-family:monospace; }
.btn-preview { padding:4px 12px; background:#080; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:12px; }
.btn-preview:hover { background:#060; }
@media (max-width: 768px) { .template-editor { grid-template-columns:1fr; } }
</style>
<form method="POST" id="templateForm">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Name <input name="name" value="{{ t.name }}" required></label>
<label>Module <select name="module_id">{% for m in modules %}<option value="{{ m.id }}" {% if m.id == t.module_id %}selected{% endif %}>{{ m.name }}</option>{% endfor %}</select></label>
<label>Content Type <select name="content_type">
  <option value="html" {% if t.content_type == 'html' %}selected{% endif %}>HTML</option>
  <option value="text" {% if t.content_type == 'text' %}selected{% endif %}>Plain Text</option>
  <option value="json" {% if t.content_type == 'json' %}selected{% endif %}>JSON</option>
</select></label>
<label>Description <input name="description" value="{{ t.description or '' }}" placeholder="Brief description of this template"></label>
<div class="template-editor">
  <div class="template-pane">
    <div class="template-pane-header">Template Body (Jinja2)</div>
    <div class="template-pane-content">
      <textarea name="body" id="templateEditor" class="editor-textarea">{{ t.body }}</textarea>
    </div>
  </div>
  <div class="template-pane">
    <div class="template-pane-header">
      <span>Preview</span>
      <span>
        <input type="text" id="contextInput" class="context-input" placeholder='{"name":"World","items":["a","b"]}' style="width:300px;display:inline-block;margin-right:8px;">
        <button type="button" class="btn-preview" id="previewBtn">Render</button>
      </span>
    </div>
    <div class="template-pane-content">
      <div id="previewContent" class="preview-frame">
        <p style="color:#888;padding:12px;">Click "Render" to preview with sample context</p>
      </div>
    </div>
  </div>
</div>
<div style="margin-top:1rem;">
<button>Save</button>
<button type="button" onclick="openTemplateAI()" style="margin-left:0.5rem;padding:6px 16px;background:#6366f1;color:#fff;border:none;border-radius:4px;cursor:pointer;">AI Improve</button>
</div>
</form>
<script>
(function() {
  var editor = document.getElementById('templateEditor');
  var preview = document.getElementById('previewContent');
  var btn = document.getElementById('previewBtn');
  var ctxInput = document.getElementById('contextInput');

  if (!editor || !btn) return;

  btn.addEventListener('click', function() {
    var body = editor.value;
    var context = {};
    try {
      var raw = ctxInput.value.trim();
      if (raw) context = JSON.parse(raw);
    } catch(e) {
      preview.innerHTML = '<div class="preview-error">Invalid JSON context: ' + e.message + '</div>';
      return;
    }

    btn.textContent = 'Rendering...';
    btn.disabled = true;

    fetch('/__admin/templates/preview', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': document.querySelector('input[name="csrf_token"]').value
      },
      body: JSON.stringify({ body: body, context: context })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      btn.textContent = 'Render';
      btn.disabled = false;
      if (data.success) {
        preview.innerHTML = data.rendered;
      } else {
        preview.innerHTML = '<div class="preview-error">' + (data.error || 'Render failed') + '</div>';
      }
    })
    .catch(function(err) {
      btn.textContent = 'Render';
      btn.disabled = false;
      preview.innerHTML = '<div class="preview-error">Request failed: ' + err.message + '</div>';
    });
  });
})();
</script>

<div id="templateAIModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10004;">
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:8px;padding:1.5rem;max-width:800px;width:90%;max-height:85vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h3 style="margin:0;">AI Template Improvement</h3>
      <button onclick="document.getElementById('templateAIModal').style.display='none'" style="background:none;border:none;font-size:1.5rem;cursor:pointer;">&times;</button>
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:0.5rem;font-weight:600;">What would you like to improve?</label>
      <textarea id="templateAIInstructions" rows="3" style="width:100%;font-family:monospace;padding:8px;border:1px solid #ccc;border-radius:4px;" placeholder="e.g., Fix HTML structure, improve accessibility, add responsive design..."></textarea>
      <button onclick="improveTemplate()" style="margin-top:0.5rem;padding:6px 16px;background:#6366f1;color:#fff;border:none;border-radius:4px;cursor:pointer;">Send to AI</button>
    </div>
    <div id="templateAIResult"></div>
  </div>
</div>

<script>
function openTemplateAI() {
  document.getElementById('templateAIInstructions').value = '';
  document.getElementById('templateAIResult').innerHTML = '';
  document.getElementById('templateAIModal').style.display = 'block';
}

function improveTemplate() {
  var instructions = document.getElementById('templateAIInstructions').value.trim();
  var body = document.getElementById('templateEditor').value;
  var resultDiv = document.getElementById('templateAIResult');
  
  if (!body) {
    resultDiv.innerHTML = '<div style="background:#fee;border:1px solid #fcc;padding:1rem;border-radius:4px;"><strong style="color:#c00;">Error:</strong> No template body to improve</div>';
    return;
  }
  
  resultDiv.innerHTML = '<p style="color:#888;">Improving template...</p>';
  
  var csrfToken = document.querySelector('[name=csrf_token]').value;
  var contentType = '{{ t.content_type }}';
  
  fetch('/__admin/templates/ask-ai', {
    method: 'POST',
    headers: { 
      'Content-Type': 'application/json', 
      'X-CSRFToken': csrfToken 
    },
    body: JSON.stringify({ 
      body: body,
      content_type: contentType,
      instructions: instructions
    })
  })
  .then(function(r) {
    if (!r.ok) {
      return r.text().then(function(text) { throw new Error('Request failed with status ' + r.status); });
    }
    return r.json();
  })
  .then(function(data) {
    if (!data.success) {
      resultDiv.innerHTML = '<div style="background:#fee;border:1px solid #fcc;padding:1rem;border-radius:4px;"><strong style="color:#c00;">Error:</strong> ' + escapeHtml(data.error) + '</div>';
      return;
    }
    
    var html = '<div style="line-height:1.6;margin-bottom:1rem;">' + formatAIResponse(data.reply) + '</div>';
    
    if (data.improved_body) {
      html += '<div style="margin-top:1rem;display:flex;gap:8px;flex-wrap:wrap;">';
      html += '<button onclick="applyTemplate(\'' + btoa(unescape(encodeURIComponent(data.improved_body))) + '\')" style="padding:6px 14px;background:#28a745;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.85em;">Apply Improvement</button>';
      html += '<button onclick="copyTemplate(\'' + btoa(unescape(encodeURIComponent(data.improved_body))) + '\')" style="padding:6px 14px;background:#f0f0f0;color:#333;border:1px solid #ccc;border-radius:4px;cursor:pointer;font-size:0.85em;">Copy to Clipboard</button>';
      html += '</div>';
    }
    
    if (data.diff && data.diff.length > 0) {
      html += renderDiff(data.diff, 'template');
    }
    
    resultDiv.innerHTML = html;
  })
  .catch(function(err) {
    resultDiv.innerHTML = '<div style="background:#fee;border:1px solid #fcc;padding:1rem;border-radius:4px;"><strong style="color:#c00;">Request failed:</strong> ' + err.message + '</div>';
  });
}

function applyTemplate(encodedBody) {
  var body = decodeURIComponent(escape(atob(encodedBody)));
  document.getElementById('templateEditor').value = body;
  document.getElementById('templateAIModal').style.display = 'none';
}

function copyTemplate(encodedBody) {
  var body = decodeURIComponent(escape(atob(encodedBody)));
  navigator.clipboard.writeText(body).then(function() {
    var btn = event.target;
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.textContent = 'Copy to Clipboard'; }, 2000);
  });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function formatAIResponse(text) {
  var html = escapeHtml(text);
  html = html.replace(/```html\s*\n([\s\S]*?)\n```/g, '<pre style="background:#f4f4f4;padding:1rem;border-radius:4px;overflow-x:auto;font-size:0.85em;border:1px solid #ddd;margin:0.5rem 0;">$1</pre>');
  html = html.replace(/```\s*\n([\s\S]*?)\n```/g, '<pre style="background:#f4f4f4;padding:1rem;border-radius:4px;overflow-x:auto;font-size:0.85em;border:1px solid #ddd;margin:0.5rem 0;">$1</pre>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function renderDiff(diffLines, type) {
  var html = '<div style="margin-top:1rem;">';
  html += '<div style="background:#f8f9fa;padding:8px 12px;border-bottom:1px solid #ddd;font-weight:600;font-size:0.9em;">Diff Preview</div>';
  html += '<pre style="background:#f4f4f4;padding:1rem;border-radius:4px;overflow-x:auto;font-size:0.8em;line-height:1.4;max-height:300px;overflow-y:auto;border:1px solid #ddd;margin:0;">';
  
  for (var i = 0; i < diffLines.length; i++) {
    var line = diffLines[i];
    var cssStyle = '';
    if (line.type === 'added') {
      cssStyle = 'style="background:#d4edda;color:#155724;"';
    } else if (line.type === 'removed') {
      cssStyle = 'style="background:#f8d7da;color:#721c24;"';
    } else {
      cssStyle = 'style="color:#666;"';
    }
    
    var prefix = '';
    if (line.type === 'added') prefix = '+ ';
    else if (line.type === 'removed') prefix = '- ';
    else prefix = '  ';
    
    html += '<div ' + cssStyle + '>' + prefix + escapeHtml(line.value) + '</div>';
  }
  
  html += '</pre></div>';
  return html;
}
</script>
